name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      # Installs the version pinned in the script — the same one the release
      # workflow uses — and fails closed if it is not runnable, so the interop
      # suite cannot quietly skip here either.
      - name: Install ocd-smoke-alarm
        run: ./.github/scripts/install-ocd-smoke-alarm.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Test
        run: go test ./... -count=1 -race -timeout 300s
        env:
          ADHD_REQUIRE_OCD_SMOKE_ALARM: "1"
          OCD_SMOKE_ALARM_BIN: "/tmp/definitely-not-here/ocd-smoke-alarm"
